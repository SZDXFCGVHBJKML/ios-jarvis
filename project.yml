name: Jarvis
options:
  bundleIdPrefix: com.boris
  deploymentTarget:
    iOS: "16.0"
targets:
  Jarvis:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boris.jarvis
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Talk to Jarvis
        NSSpeechRecognitionUsageDescription: Transcribe your voice for Jarvis
