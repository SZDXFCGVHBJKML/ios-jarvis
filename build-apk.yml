name: Build APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate signing key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias jarvis \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass jarvis123 -keypass jarvis123 \
            -dname "CN=Jarvis"

      - name: Build APK
        env:
          JARVIS_VERSION: "1.0.${{ github.run_number }}"
          JARVIS_VERCODE: "${{ github.run_number }}"
        run: |
          export CI_KEYSTORE="$RUNNER_TEMP/ci.jks"
          gradle -p android assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk Jarvis.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest -t "Jarvis (auto-built)" -n "Rolling latest build"
          gh release upload latest Jarvis.apk --clobber
