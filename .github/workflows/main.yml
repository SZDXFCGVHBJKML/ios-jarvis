name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: App icon from icon.png
        run: |
          DIR=$(dirname "$(find . -name project.yml -not -path '*/.*' | head -1)")
          echo "PROJDIR=$DIR" >> "$GITHUB_ENV"
          if [ -f "$DIR/icon.png" ]; then
            SET="$DIR/Sources/Assets.xcassets/AppIcon.appiconset"
            mkdir -p "$SET"
            cp "$DIR/icon.png" "$SET/icon.png"
            printf '%s' '{"images":[{"filename":"icon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$SET/Contents.json"
            printf '%s' '{"info":{"author":"xcode","version":1}}' > "$DIR/Sources/Assets.xcassets/Contents.json"
          fi

      - name: Build (unsigned)
        run: |
          cd "$PROJDIR"
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i '' "s/MARKETING_VERSION: \"[^\"]*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"[^\"]*\"/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          xcodegen generate
          xcodebuild -project Jarvis.xcodeproj -scheme Jarvis \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" ARCHS=arm64 build

      - name: Verify version stamp
        run: |
          cd "$PROJDIR"
          PLIST="build/Build/Products/Release-iphoneos/Jarvis.app/Info.plist"
          GOT=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")
          echo "built version: $GOT (expected $VERSION)"
          [ "$GOT" = "$VERSION" ]

      - name: Package IPA + source.json
        run: |
          cd "$PROJDIR"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Jarvis.app Payload/
          zip -qr Jarvis.ipa Payload
          SIZE=$(stat -f%z Jarvis.ipa)
          DATE=$(date -u +%Y-%m-%d)
          REPO="${{ github.repository }}"
          python3 - <<PYEOF
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          src = {
            "name": "Jarvis",
            "identifier": "com.boris.jarvis.source",
            "apps": [{
              "name": "Jarvis",
              "bundleIdentifier": "com.boris.jarvis",
              "developerName": "Boris",
              "subtitle": "Local AI, in your pocket",
              "localizedDescription": "Talks to the Jarvis home server: Ollama personas, Piper voices, ComfyUI images.",
              "iconURL": f"https://raw.githubusercontent.com/{repo}/main/icon.png",
              "tintColor": "#ffb02e",
              "versions": [{
                "version": "$VERSION",
                "date": "$DATE",
                "size": $SIZE,
                "minOSVersion": "16.0",
                "downloadURL": f"https://github.com/{repo}/releases/download/latest/Jarvis.ipa"
              }]
            }]
          }
          json.dump(src, open("source.json", "w"), indent=2)
          print(open("source.json").read())
          PYEOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$PROJDIR"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest -t "Jarvis (auto-built)" -n "Rolling latest build"
          gh release upload latest Jarvis.ipa source.json --clobber
